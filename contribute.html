<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿 - 星语铭</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .contrib-card {
            background: var(--pure-white);
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 4px 20px var(--shadow);
            max-width: 640px;
            margin-left: auto;
            margin-right: auto;
        }
        .contrib-card h2 { text-align: center; margin-bottom: 1.2rem; font-weight: 400; }
        .contrib-tip { text-align: center; color: var(--text-light); font-size: .9rem; margin-bottom: 1.5rem; }
        .contrib-form { display: flex; flex-direction: column; gap: .8rem; }
        .contrib-form input[type=text], .contrib-form textarea {
            border: 1px solid var(--border-light); border-radius: 8px; padding: .6rem .9rem;
            font: inherit; outline: none; background: var(--light-gray);
        }
        .contrib-form input:focus, .contrib-form textarea:focus { border-color: var(--sky-blue); background: var(--pure-white); }
        .contrib-form textarea { min-height: 70px; resize: vertical; }
        .file-zone {
            border: 2px dashed var(--border-light); border-radius: 10px; padding: 1.6rem 1rem;
            text-align: center; color: var(--text-light); cursor: pointer; transition: all .2s;
        }
        .file-zone:hover, .file-zone.drag { border-color: var(--coral-pink); background: var(--light-blue); color: var(--klein-blue); }
        .file-zone b { color: var(--klein-blue); }
        .file-selected { color: var(--text-dark); font-size: .92rem; background: var(--light-gray); border-radius: 8px; padding: .6rem .9rem; word-break: break-all; }
        .progress-wrap { display: none; background: var(--light-gray); border-radius: 8px; height: 14px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(45deg, var(--sky-blue), var(--coral-pink)); transition: width .2s; }
        .progress-text { font-size: .85rem; color: var(--text-light); text-align: center; }
        .contrib-msg { text-align: center; font-size: .92rem; min-height: 1.4em; }
        .contrib-msg.ok { color: #2e9e5b; }
        .contrib-msg.err { color: #D32F2F; }
        .contrib-btn { align-self: center; min-width: 200px; }
        .contrib-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">星语铭</div>
            <ul class="nav-links">
                <li><a href="/admin">后台管理</a></li>
                <li><a href="/contribute.html">投稿</a></li>
                <li><a href="/">主页</a></li>
                <li><a href="/about.html">关于我们</a></li>
                <li><a href="/compliance.html">合规声明</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="contrib-card">
                <h2>📮 投稿提交</h2>
                <div class="contrib-tip">
                    照片、文章、音频……TA 相关的资料都可以放这里。<br>
                    什么类型都收，单个文件不超过 <b>200MB</b>，只有管理员看得到。<br>
                    <small>传大文件时别关页面，看到「投稿成功」和编号才算完成。</small>
                </div>
                <form class="contrib-form" id="contribForm">
                    <input type="text" id="fName" maxlength="32" placeholder="你的昵称（留空则为匿名）">
                    <textarea id="fNote" maxlength="200" placeholder="备注说明（可选）：这份资料是什么、与谁有关…"></textarea>
                    <label class="file-zone" id="fileZone" for="fFile">
                        点击选择文件，或把文件拖到这里<br>
                        <small>任意类型均可 · 单文件 ≤ 200MB</small>
                    </label>
                    <input type="file" id="fFile" style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; clip:rect(0 0 0 0);">
                    <div class="file-selected" id="fileInfo" style="display:none;"></div>
                    <div class="progress-wrap" id="progWrap"><div class="progress-bar" id="progBar"></div></div>
                    <div class="progress-text" id="progText"></div>
                    <button type="submit" class="btn contrib-btn" id="btnSubmit">送出投稿</button>
                    <div class="contrib-msg" id="contribMsg"></div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container" style="text-align:center; padding: 2rem 0; color: var(--text-light); font-size: .88rem;">
            星语铭纪念计划 · 愿所有灵魂，终将在没有黑暗的地方重逢
        </div>
    </footer>

    <script>
    (function () {
        var MAX = 200 * 1024 * 1024;
        var fileInput = document.getElementById('fFile');
        var zone = document.getElementById('fileZone');
        var info = document.getElementById('fileInfo');
        var msg = document.getElementById('contribMsg');
        var btn = document.getElementById('btnSubmit');
        var progWrap = document.getElementById('progWrap');
        var progBar = document.getElementById('progBar');
        var progText = document.getElementById('progText');
        var selectedFile = null;   // 记住选中的文件（不依赖 input.files）

        function fmtSize(n) {
            if (n >= 1073741824) return (n / 1073741824).toFixed(2) + ' GB';
            if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
            if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
            return n + ' B';
        }

        function pickFile(f) {
            msg.textContent = ''; msg.className = 'contrib-msg';
            if (!f) return;
            if (f.size === 0) {
                selectedFile = null;
                info.style.display = 'none';
                msg.textContent = '不能上传空文件';
                msg.className = 'contrib-msg err';
                return;
            }
            if (f.size > MAX) {
                selectedFile = null;
                info.style.display = 'none';
                msg.textContent = '文件过大（' + fmtSize(f.size) + '），投稿上限 200MB';
                msg.className = 'contrib-msg err';
                return;
            }
            selectedFile = f;
            info.style.display = 'block';
            info.textContent = '已选择：' + f.name + '（' + fmtSize(f.size) + '）';
        }

        fileInput.addEventListener('change', function () { pickFile(this.files[0]); });

        // 拖拽上传
        ['dragover', 'dragenter'].forEach(function (ev) {
            zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.add('drag'); });
        });
        ['dragleave', 'drop'].forEach(function (ev) {
            zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.remove('drag'); });
        });
        zone.addEventListener('drop', function (e) {
            pickFile(e.dataTransfer.files[0]);
        });

        document.getElementById('contribForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var f = selectedFile || (fileInput.files && fileInput.files[0]);
            if (!f) { msg.textContent = '请先选择文件'; msg.className = 'contrib-msg err'; return; }
            if (f.size > MAX) { msg.textContent = '文件超过 200MB 上限'; msg.className = 'contrib-msg err'; return; }

            var fd = new FormData();
            fd.append('name', document.getElementById('fName').value.trim());
            fd.append('note', document.getElementById('fNote').value.trim());
            fd.append('file', f, f.name);

            btn.disabled = true;
            progWrap.style.display = 'block';
            progBar.style.width = '0%';
            msg.textContent = ''; msg.className = 'contrib-msg';

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/contribute');
            xhr.upload.onprogress = function (ev) {
                if (ev.lengthComputable) {
                    var pct = Math.round(ev.loaded / ev.total * 100);
                    progBar.style.width = pct + '%';
                    progText.textContent = '上传中 ' + pct + '%（' + fmtSize(ev.loaded) + ' / ' + fmtSize(ev.total) + '）';
                }
            };
            xhr.onload = function () {
                btn.disabled = false;
                var data = {};
                try { data = JSON.parse(xhr.responseText); } catch (err) {}
                if (xhr.status === 201) {
                    progBar.style.width = '100%';
                    progText.textContent = '上传完成 ✓';
                    msg.textContent = '✓ 投稿成功！编号 ' + data.id + '，感谢你的分享 🌸';
                    msg.className = 'contrib-msg ok';
                    selectedFile = null;
                    fileInput.value = ''; info.style.display = 'none';
                    document.getElementById('fNote').value = '';
                    setTimeout(function () { progWrap.style.display = 'none'; progText.textContent = ''; }, 2000);
                } else {
                    progWrap.style.display = 'none';
                    msg.textContent = data.error || ('提交失败（HTTP ' + xhr.status + '）');
                    msg.className = 'contrib-msg err';
                }
            };
            xhr.onerror = function () {
                btn.disabled = false;
                progWrap.style.display = 'none';
                msg.textContent = '网络错误，请稍后重试';
                msg.className = 'contrib-msg err';
            };
            xhr.send(fd);
        });
    })();
    </script>
</body>
</html>
